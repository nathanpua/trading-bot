# ─────────────────────────────────────────────────────────────
# Autonomous Trading System — Configuration
# Paper trading account. All risk limits are HARD (code-enforced).
# Edit this file to tune the system — no code changes needed.
# ─────────────────────────────────────────────────────────────

account:
  paper: true                    # paper trading only (safety lock)
  base_capital: 100000           # reference starting capital ($)

risk:
  max_risk_per_trade: 0.02       # 2% of portfolio at risk per trade
  max_concentration: 0.25        # 25% max in a single position at ENTRY
  concentration_trim_threshold: 0.32  # trim existing positions only above 32%
                                  # (lets winners run without churning on minor drift)
  max_sleeve_exposure: 0.35      # 35% max per universe group (e.g. GLD+SLV+GDX
                                  # combined) — caps correlated-position clusters
  max_positions: null            # null = UNLIMITED concurrent positions
                                  # (capital is bounded by max_concentration 25% at entry
                                  #  and max_total_exposure 90% — count is not a constraint)
  max_total_exposure: 0.90       # never more than 90% invested
  max_daily_loss: 0.02           # -2% in one day → HALT new entries
  max_drawdown: 0.08             # -8% from equity high-water → DEFENSIVE
  atr_stop_mult: 1.5             # stop = entry - 1.5×ATR
  reward_ratio: 3.0              # target = 3× stop distance (3:1 R/R — widened from
                                  # 2:1: live payoff was 0.53; 2y backtest universe
                                  # mean -3.2% → +10.1% at 3:1)

strategy:
  entry_threshold: 2             # min confluence score (of 5) to qualify
  composite_veto: -0.15          # block BUYs whose multi-strategy composite score
                                 # is below this (bearish alpha-zoo consensus)
  require_uptrend: true          # only enter if price > SMA50 (trend filter)
  require_macd_positive: true    # only enter if MACD histogram > 0
  universe:                      # symbols the scanner evaluates (LSE-covered ETFs)
                                 # NOTE: leveraged-inverse / thematic ETFs removed
                                 # 2026-09: trend-following into decay vehicles
                                 # (SQQQ -39%, SOXS -62%) and thematic/crypto
                                 # (ARKK, BITO -35%, IBIT -24%) was the largest
                                 # historical loss source (2y backtest + live P&L).
    broad:      [SPY, QQQ, IWM, VOO, DIA, VTI]           # broad market indices
    sectors:    [XLE, XLF]                                 # sector SPDRs
    semis:      [SMH, SOXX, SOXL]                         # semiconductors
    commodities: [GLD, SLV, GDX]                           # gold, silver, miners
    crypto:     [ETHA]                                     # crypto ETFs
    bonds:      [TLT, HYG]                                 # treasury + high yield
    emerging:   [EEM]                                      # emerging markets

position_management:
  trailing_stop_activate_r: 1.0  # start trailing after +1R profit
  trailing_stop_distance_atr: 1.0  # trail stop by 1 ATR
  time_stop_days: 15             # exit if flat/no-progress for N days
  min_hold_days: 3               # block AI TRIMs of PROFITABLE positions held fewer
                                 # than N trading days (loss-cutting and full exits
                                 # always allowed; bracket stops unaffected)
  friday_entry_size_factor: 0.5  # half-size new entries on Fridays (Fri entries
                                 # lost -$495 over 31 trades in first 4 weeks; A/B test)
  signal_flip_exit: true         # exit if buy thesis invalidates (MACD neg + below SMA)
  signal_flip_confirm_bars: 3    # require N consecutive bearish bars before signal-flip
                                 # exit (raised from 2: losers exited after ~1 day)
  earnings_grace_days: 5         # suppress signal-flip exit if earnings within N days
  earnings_behavior: HOLD        # HOLD | REDUCE | FLATTEN | ADAPTIVE
  earnings_guard_days: 1         # not used when HOLD, kept for other modes

regime:
  # Risk multiplier scales all position sizes. Deterministic from market data.
  vix_risk_on_threshold: 18      # VIX below this → favors RISK-ON
  vix_risk_off_threshold: 25     # VIX above this → RISK-OFF
  spy_trend_lookback: 50         # SPY above/below SMA50 sets broad trend

reporting:
  log_dir: reports/autonomous    # decision logs + state
  notify_on_trade: true
  notify_on_halt: true
  notify_on_eod: true
